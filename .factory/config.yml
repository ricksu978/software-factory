# How the factory runs this repo's checks. Plan Task 9's parseRepoConfig reads this file.
bdd:
  parse: npm run bdd -- --dry-run
  run: npm run bdd -- --tags "not @local"
  report: reports/bdd.ndjson
commands:
  # A cell's clone has no node_modules. The engine runs this before any stage, so every gate command finds its tools.
  setup: npm ci
  test: npm test
  lint: node scripts/prose-lint.mjs $(git ls-files '*.md' '*.html')
# PBI 399: the minutes a cell gives each command it runs before it stops it. The full suite outgrew the 15 by default.
command_timeout_minutes: 40
