name: prose
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
      - run: node scripts/prose-lint.mjs $(git ls-files '*.md' '*.html')
