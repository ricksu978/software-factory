name: ci

# Push only, on every branch, so a PR's push runs once. Every PR here comes from a branch in this repo. Don't swap it
# for pull_request: GitHub runs no pull_request workflow on a PR with a merge conflict, and a factory cell would wait
# on CI that never runs.
on:
  push:

# A new push to a branch cancels that branch's run still going, since only its newest head matters. A run on main is
# never cancelled, so every merge gets a run of its own. The factory reads a cancelled run as neither failed nor
# passed (PBI 423).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Runs the build script when package.json has one, so an item can add the SPA's Vite build and type check
      # (redesign step 8) without touching this file, which no factory cell may change. Before the tests, which serve
      # the built files.
      - run: npm run --if-present build
      # The AppHost is its own npm project, and its types come from .aspire/modules, which aspire restore generates and
      # git ignores. The root typecheck never sees it (PBI 303). Keep the CLI at sdk.version in aspire.config.json.
      - run: npm install -g @microsoft/aspire-cli@13.6.4
      - run: npm ci
        working-directory: aspire-apphost
      - run: aspire restore --non-interactive
      - run: npx tsc -p tsconfig.apphost.json --noEmit && npx eslint apphost.mts
        working-directory: aspire-apphost
      - run: npm test
      - run: npm run bdd -- --tags "not @local"
