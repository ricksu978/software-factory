name: ci

# Push only, so a PR's push runs once. pull_request would run a second time, and GitHub skips it on a PR with a merge
# conflict, which leaves a factory cell waiting on CI that never comes. Every PR here comes from a branch in this repo.
on:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bdd -- --tags "not @local"
