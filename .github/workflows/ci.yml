name: ci

# Push only, on every branch, so a PR's push runs once. Every PR here comes from a branch in this repo. Don't swap it
# for pull_request: GitHub runs no pull_request workflow on a PR with a merge conflict, and a factory cell would wait
# on CI that never runs.
on:
  push:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run bdd -- --tags "not @local"
